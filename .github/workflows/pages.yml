name: Publish Game to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build browser game
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pygbag==0.9.3
          for audio in GameBuddy/*.mp3 GameBuddy/*.wav; do
            [ -f "$audio" ] || continue
            ffmpeg -y -i "$audio" -vn -c:a libvorbis -q:a 4 "${audio%.*}.ogg"
          done
          find GameBuddy -type f \( -name '*.mp3' -o -name '*.wav' \) -delete
          python -m pygbag --build GameBuddy/main.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: GameBuddy/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
